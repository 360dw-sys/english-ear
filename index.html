<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Ear</title>
<meta name="theme-color" content="#11131a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#11131a; --card:#1a1d27; --card2:#222634; --line:#2c3142;
  --text:#eef0f5; --muted:#9aa1b4; --accent:#e8a33d; --accent2:#5cc8a1; --bad:#e06c6c;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
header h1{font-size:20px;margin:0;letter-spacing:.2px}
header h1 span{color:var(--accent)}
.streak{font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);margin:0 6px 6px 0}
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin:10px 0}
.player-wrap > div,.player-wrap iframe{position:absolute;inset:0;width:100%;height:100%}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0}
.step{text-align:center;padding:8px 2px;border-radius:10px;background:var(--card2);color:var(--muted);font-size:10.5px;border:1px solid transparent;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.step.on{border-color:var(--accent);color:var(--text)}
.step.done{background:#22362f;color:var(--accent2)}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--card2);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:#1a1205;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row > *{flex:1 1 auto}
textarea,input{width:100%;font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.chunks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.chunks button{padding:10px 0;font-size:14px}
.chunks button.playing{background:var(--accent);color:#1a1205}
.score{font-size:40px;font-weight:700;color:var(--accent2);margin:6px 0}
.diff{background:var(--card2);border-radius:12px;padding:12px;line-height:1.9}
.diff .ok{color:var(--text)}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.phrase{font-weight:600;color:var(--accent)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;padding:0;accent-color:var(--accent)}
.range b{min-width:52px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0f15ee;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
nav button{flex:1;background:transparent;color:var(--muted);font-size:13px;padding:8px}
nav button.on{color:var(--accent)}
.hidden{display:none!important}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:0}
.growth{font-weight:700;color:var(--accent2)}
.counter{font-size:28px;font-weight:700;text-align:center}
.hint{background:#2a2414;border:1px solid #4a3d1c;color:#f0d9a4;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
</style>
</head>
<body>
<header>
  <h1>English <span>Ear</span></h1>
  <div class="streak" id="streak"></div>
</header>

<main id="view-today"></main>
<main id="view-library" class="hidden"></main>
<main id="view-progress" class="hidden"></main>

<nav>
  <button data-view="today" class="on">Сегодня</button>
  <button data-view="library">Отрывки</button>
  <button data-view="progress">Прогресс</button>
</nav>

<script src="https://www.youtube.com/iframe_api" async></script>
<script src="app.js"></script>
</body>
</html>
