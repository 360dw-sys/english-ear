name: Ночной конвейер English Ear

on:
  schedule:
    - cron: "35 5 * * *"   # 7:35 летом и 6:35 зимой по Берлину
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency: daily

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Озвучить и опубликовать отрывок дня
        run: python3 scripts/daily.py
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Сохранить в репозиторий
        run: |
          git config user.name "english-ear-bot"
          git config user.email "english-ear-bot@users.noreply.github.com"
          git add -A clips.json content/queue.json audio
          git diff --cached --quiet || git commit -m "Отрывок дня $(date +%F)"
          git push
      - name: Обновить сайт
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
