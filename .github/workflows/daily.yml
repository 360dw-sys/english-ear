name: Ночной конвейер English Ear

on:
  schedule:
    - cron: "35 5 * * *"   # 7:35 летом и 6:35 зимой по Берлину
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency: daily

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить распознавание речи
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper==1.1.1
      - name: Найти живой фрагмент и опубликовать
        shell: bash
        run: |
          set -o pipefail
          python -u scripts/daily.py 2>&1 | tee content/last_run.txt
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Сохранить в репозиторий
        if: always()
        run: |
          git config user.name "english-ear-bot"
          git config user.email "english-ear-bot@users.noreply.github.com"
          git add clips.json content/history.json content/last_run.txt
          git diff --cached --quiet || git commit -m "Отрывок дня $(date +%F)"
          git push
      - name: Обновить сайт
        if: always()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds || true
